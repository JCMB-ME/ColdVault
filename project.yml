name: ColdVault
options:
  bundleIdPrefix: com.coldvault
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_ALLOWED: NO

targets:
  ColdVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColdVault
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.coldvault.wallet
      INFOPLIST_FILE: ColdVault/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_NAME: ColdVault
      TARGETED_DEVICE_FAMILY: "1"

  ColdVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColdVaultTests
    dependencies:
      - target: ColdVault
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.coldvault.wallet.tests
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_NAME: ColdVaultTests
