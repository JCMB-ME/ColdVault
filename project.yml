name: ColdVault
options:
  bundleIdPrefix: com.coldvault
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  ENABLE_BITCODE: NO
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_ALLOWED: NO

packages:
  CSecp256k1:
    path: Vendor/CSecp256k1
  # Embedded Tor (official iCepa build, checksum-pinned) + C shim. See Vendor/TorLocal.
  TorLocal:
    path: Vendor/TorLocal
  # Lightning engines, pinned by commit (a tag can be moved): breez-sdk-spark-swift 0.26.1 and
  # ldk-node v0.7.0. To update: review the new release, then change the revision.
  BreezSdkSpark:
    url: https://github.com/breez/breez-sdk-spark-swift
    revision: 2a9f457e9bb84b09f09b5816b07b4ec3612e2e8a   # 0.26.1
  LDKNode:
    url: https://github.com/lightningdevkit/ldk-node
    revision: 68ab7f417e595f3997dd598ebe070dd5d1b5facf   # v0.7.0

targets:
  ColdVault:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColdVault
    dependencies:
      - package: CSecp256k1
        product: CSecp256k1
      - package: TorLocal
        product: TorLocal
      - package: BreezSdkSpark
        product: BreezSdkSpark
      - package: LDKNode
        product: LDKNode
      - target: ColdVaultWidget
    entitlements:
      path: ColdVault/ColdVault.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.coldvault.wallet
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.coldvault.wallet
      INFOPLIST_FILE: ColdVault/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # Settings › Appearance › App icon (inverted colours).
      ASSETCATALOG_COMPILER_ALTERNATE_APP_ICON_NAMES: AppIconInverted
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_NAME: ColdVault
      TARGETED_DEVICE_FAMILY: "1"

  # Home-screen / lock-screen balance widget. Reads the balance the app publishes in
  # the shared App Group container; it has no keys and makes no network requests.
  ColdVaultWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColdVaultWidget
    info:
      path: ColdVaultWidget/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: ColdVault
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ColdVaultWidget/ColdVaultWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.coldvault.wallet
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.coldvault.wallet.widget
      PRODUCT_NAME: ColdVaultWidget
      GENERATE_INFOPLIST_FILE: NO
      SKIP_INSTALL: YES
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      TARGETED_DEVICE_FAMILY: "1"

  ColdVaultTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ColdVaultTests
    dependencies:
      - target: ColdVault
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.coldvault.wallet.tests
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      PRODUCT_NAME: ColdVaultTests
