name: iOS CI - Build ColdVault

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test iOS App
    # Xcode 27 image: newest iOS SDK (iOS 27).
    runs-on: xcode-27

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 27 (iOS 27 SDK)
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          sudo xcode-select -s /Applications/Xcode_27.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Pick iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project ColdVault.xcodeproj \
            -scheme ColdVault \
            -destination "id=$SIM_UDID" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build for Generic iOS Device (Release)
        run: |
          xcodebuild build \
            -project ColdVault.xcodeproj \
            -scheme ColdVault \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_device \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Unsigned IPA
        run: |
          mkdir -p build_device/Payload
          cp -r build_device/Build/Products/Release-iphoneos/ColdVault.app build_device/Payload/
          cd build_device
          zip -qr ../ColdVault.ipa Payload
          cd ..
          ls -lh ColdVault.ipa

      - name: Build for iOS Simulator (Release)
        run: |
          xcodebuild build \
            -project ColdVault.xcodeproj \
            -scheme ColdVault \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath build_sim \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Simulator App
        run: |
          cd build_sim/Build/Products/Release-iphonesimulator
          zip -qr ../../../ColdVault-Simulator.app.zip ColdVault.app
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColdVault-iOS-IPA
          path: ColdVault.ipa
          retention-days: 14

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColdVault-Simulator-App
          path: ColdVault-Simulator.app.zip
          retention-days: 14
